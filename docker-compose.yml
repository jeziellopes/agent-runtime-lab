# `docker compose up` from a clean clone brings up all four cells and then
# prints the contract suite result.

services:
  nestjs-node:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    environment:
      ENTRY: adapters/nestjs/dist/main.js
      PORT: 3000
      LLM_MODE: replay
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health')"]
      interval: 5s
      retries: 12

  hono-node:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    environment:
      ENTRY: adapters/hono/dist/server.js
      PORT: 3001
      LLM_MODE: replay
    ports:
      - '3001:3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/health')"]
      interval: 5s
      retries: 12

  nestjs-bun:
    build:
      context: .
      dockerfile: docker/bun.Dockerfile
    environment:
      ENTRY: adapters/nestjs/dist/main.js
      PORT: 3002
      LLM_MODE: replay
    ports:
      - '3002:3002'
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:3002/health')"]
      interval: 5s
      retries: 12

  hono-bun:
    build:
      context: .
      dockerfile: docker/bun.Dockerfile
    environment:
      ENTRY: adapters/hono/dist/server.bun.js
      PORT: 3003
      LLM_MODE: replay
    ports:
      - '3003:3003'
    healthcheck:
      test: ['CMD', 'bun', '-e', "fetch('http://127.0.0.1:3003/health')"]
      interval: 5s
      retries: 12

  # The suite imports zero framework packages and runs once per cell against a
  # base URL. It must be green on all four.
  contract-tests:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    command: ['node', 'packages/contract-tests/dist/cli.js', '--all']
    depends_on:
      nestjs-node:
        condition: service_healthy
      hono-node:
        condition: service_healthy
      nestjs-bun:
        condition: service_healthy
      hono-bun:
        condition: service_healthy
